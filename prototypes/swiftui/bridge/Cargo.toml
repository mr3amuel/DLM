[workspace]

[package]
name = "dlm_swift_experiment"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
download_core = { path = "../../../crates/download_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "io-util", "time", "macros"] }

fs2 = "0.4"
getrandom = "0.2"
subtle = "2"
hmac = "0.12"
sha2 = "0.10"
libc = "0.2"
url = "2"

[profile.release]
strip = "debuginfo"

[dev-dependencies]
tempfile = "3.27.0"
