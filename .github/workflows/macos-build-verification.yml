name: macOS Build Verification

# Deliberately independent of publication policy; manual execution only.
on:
  workflow_dispatch: {}

permissions:
  contents: read

# Keep at most one verification run active, including dispatches on other refs.
concurrency:
  group: macos-build-verification
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      DLM_NATIVE_CONFIGURATION: development
      DLM_NATIVE_SANDBOX: '0'
      DLM_NATIVE_ARCH: ${{ matrix.arch }}
      RUST_TARGET: ${{ matrix.rust_target }}
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install repository-pinned Rust toolchain
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" != "$DLM_NATIVE_ARCH" ]]; then
            echo '::error::Runner architecture does not match the verification matrix.'
            exit 1
          fi
          if ! toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' 2> "$RUNNER_TEMP/dlm-verification-config.log"); then
            echo '::error::Cannot read the repository toolchain configuration.'
            exit 1
          fi
          if [[ ! "$toolchain" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Expected a version-pinned Rust toolchain.'
            exit 1
          fi
          if ! rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy --target "$RUST_TARGET" > "$RUNNER_TEMP/dlm-verification-toolchain.log" 2>&1; then
            echo '::error::Pinned Rust setup failed; detailed output stays runner-local.'
            exit 1
          fi
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          echo 'Pinned toolchain ready.'

      - name: Run isolated Rust and Foundation checks
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/dlm-verification-rust"
          installed_toolchain="$RUSTUP_TOOLCHAIN"
          . scripts/env.sh
          if [[ "$RUSTUP_TOOLCHAIN" != "$installed_toolchain" ]]; then
            echo '::error::Repository Rust toolchain pins disagree.'
            exit 1
          fi
          run_check() {
            local label="$1"
            local logfile="$2"
            shift 2
            if ! "$@" > "$RUNNER_TEMP/$logfile" 2>&1; then
              echo "::error::$label failed; detailed output stays runner-local."
              exit 1
            fi
            echo "$label passed."
          }
          run_check 'Core unit checks' dlm-verification-core.log \
            cargo test --locked --target "$RUST_TARGET" -p download_core --lib
          run_check 'Native adapter ABI check' dlm-verification-adapter.log \
            cargo test --locked --target "$RUST_TARGET" --manifest-path prototypes/swiftui/bridge/Cargo.toml --lib abi_rejects_invalid_commands_and_coalesces_idle_snapshots
          run_check 'Native browser identity check' dlm-verification-host.log \
            cargo test --locked --target "$RUST_TARGET" -p download_bridge --features native-chrome --bin dlm-browser-host identity_storage_and_manifest_paths_are_configuration_scoped
          run_check 'Foundation identity check compilation' dlm-verification-swift.log \
            xcrun swiftc -module-cache-path "$RUNNER_TEMP/dlm-verification-swift-cache" \
            -target "$DLM_NATIVE_ARCH-apple-macos13.0" \
            prototypes/swiftui/Sources/NativeIdentity.swift prototypes/swiftui/Tests/IdentityChecks.swift \
            -o "$RUNNER_TEMP/dlm-verification-identity-checks"
          run_check 'Foundation identity checks' dlm-verification-identity.log \
            "$RUNNER_TEMP/dlm-verification-identity-checks"

      - name: Build development Debug app without launching it
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/dlm-verification-rust"
          export DLM_NATIVE_HOST_TARGET_DIR="$RUNNER_TEMP/dlm-verification-host"
          if ! ./prototypes/swiftui/build.sh debug > "$RUNNER_TEMP/dlm-verification-build.log" 2>&1; then
            echo '::error::Native development build failed; detailed output stays runner-local.'
            exit 1
          fi
          echo 'Development Debug app and native helper built; build script signature checks passed.'

      - name: Verify built development identity, resources and architectures
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/dlm-verification-bundle.log" 2>&1 || { echo '::error::Development bundle validation failed; detailed output stays runner-local.'; exit 1; }
          import json
          import os
          import plistlib
          import subprocess
          from pathlib import Path
          app = Path('prototypes/swiftui/build/DLM Native Development Debug.app')
          info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
          arch = os.environ['DLM_NATIVE_ARCH']
          assert info['CFBundleIdentifier'] == 'com.dlm.native-development'
          assert info.get('DLMProduction', False) is False
          assert info['DLMArchitecture'] == arch
          for binary in ['Contents/MacOS/DLMSwiftExperiment', 'Contents/Helpers/dlm-native-chrome-host']:
              actual = subprocess.check_output(['lipo', '-archs', str(app / binary)], stderr=subprocess.DEVNULL).decode().split()
              assert actual == [arch]
          resources = app / 'Contents/Resources'
          for name in ['DLMBrand.png', 'DLMIcon.icns', 'Assets.car', 'fa.lproj/Localizable.strings',
                       'DLMChromeExtension/manifest.json', 'DLMFirefoxExtension/manifest.json',
                       'ThirdPartyNotices/THIRD_PARTY_NOTICES.md', 'ThirdPartyNotices/SOURCE_AVAILABILITY.md']:
              assert (resources / name).is_file()
          notices = resources / 'ThirdPartyNotices'
          for dependency in json.loads((notices / 'RUST_DEPENDENCIES.json').read_text()):
              for name in dependency['notices']:
                  relative = Path(name)
                  assert not relative.is_absolute() and '..' not in relative.parts
                  assert relative.parts[0] == 'third-party'
                  assert (notices / Path(*relative.parts[1:])).is_file()
          PY
          echo 'Development bundle identity, resources, notices and binary architectures verified.'

      # No app launch, registration, installer, packaging, cache, artifact upload,
      # publication credentials or release operation belongs in this workflow.
