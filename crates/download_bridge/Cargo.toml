[package]
name = "download_bridge"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
native-chrome = []
native-production = ["native-chrome"]

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json = "1"
url = "2"
getrandom = "0.2"
subtle = "2"
hmac = "0.12"
sha2 = "0.10"
libc = "0.2"
fs2 = "0.4"

[[bin]]
name = "dlm-browser-host"
path = "src/bin/dlm-browser-host.rs"

[dev-dependencies]
tempfile = "3"
